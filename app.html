<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Plant Disease Detection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>🌿 AI Plant Disease Detection</h1>
            <p>Upload a plant leaf image to detect possible diseases.</p>

            <div class="upload-section">
                <input type="file" id="imageInput" accept="image/*">
                <button id="predictBtn">Detect Disease</button>
            </div>

            <div class="preview-section">
                <img id="previewImage" src="" alt="Image Preview">
            </div>

            <div id="result">
                <h3>Prediction Result</h3>
                <p>Upload an image and click Detect Disease.</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
